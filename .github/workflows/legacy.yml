name: Legacy Forge

on:
  push:
    branches: [forge-1.12.2, port/forge-1.7.10]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Forge ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: "1.7.10"
            directory: legacy/forge1710
          - minecraft: "1.8.9"
            directory: legacy
          - minecraft: "1.12.2"
            directory: legacy/forge112
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
      - name: Select Java 17 for RetroFuturaGradle
        if: matrix.minecraft == '1.7.10'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Expose Java 8 to Gradle toolchain discovery
        if: matrix.minecraft == '1.7.10'
        run: |
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.java.installations.paths=$JAVA_HOME_8_X64" >> "$HOME/.gradle/gradle.properties"
      - name: Configure Maven Central mirror for the runner
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cp legacy/verification/ci-repositories.gradle "$HOME/.gradle/init.d/"
      - name: Fetch upstream 1.8.9 build plugin
        if: matrix.minecraft == '1.8.9'
        uses: actions/checkout@v4
        with:
          repository: ManTouQAQ/ForgeGradle-Modern-2.1
          ref: 94fc6aa3bdefbfd848256c9a2e365739232ee071
          path: .ci/forgegradle
          persist-credentials: false
      - name: Build upstream 1.8.9 plugin from source
        if: matrix.minecraft == '1.8.9'
        working-directory: .ci/forgegradle
        run: |
          git apply "$GITHUB_WORKSPACE/legacy/verification/forgegradle-task-inputs.patch"
          bash gradlew --no-daemon publishToMavenLocal
      - name: Generate 1.8.9 Forge compile jar
        if: matrix.minecraft == '1.8.9'
        working-directory: legacy
        run: bash gradlew --no-daemon setupCiWorkspace --stacktrace
      - name: Build production jar
        working-directory: ${{ matrix.directory }}
        run: bash gradlew --no-daemon clean build --stacktrace
      - name: Verify remapped production jar
        run: python3 legacy/verification/verify_archive.py ${{ matrix.minecraft }} ${{ matrix.directory }}/build/libs/DangoMusic-*+${{ matrix.minecraft }}.jar
      - name: Decode and seek in the shipped JAR
        if: matrix.minecraft != '1.8.9'
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          qa="$RUNNER_TEMP/dango-audio"
          mkdir -p "$qa"
          for codec in mp3 ogg flac; do
            ffmpeg -v error -f lavfi -i sine=frequency=440:sample_rate=44100:duration=1 "$qa/tone.$codec"
          done
          jar=(${{ matrix.directory }}/build/libs/DangoMusic-*+${{ matrix.minecraft }}.jar)
          gson=$(find "$HOME/.gradle/caches" -name gson-2.2.4.jar -print -quit)
          log4j=$(find "$HOME/.gradle/caches" -name log4j-api-2.0-beta9.jar -print -quit)
          if [[ -z "$log4j" ]]; then
            log4j="$qa/log4j-api-2.17.2.jar"
            curl -fsSL --retry 3 -o "$log4j" https://repo.maven.apache.org/maven2/org/apache/logging/log4j/log4j-api/2.17.2/log4j-api-2.17.2.jar
          fi
          cp="$qa:${jar[0]}:$gson:$log4j"
          "$JAVA_HOME_8_X64/bin/javac" -cp "$cp" -d "$qa" legacy/forge112/verification/{ArtifactSmoke,SeekResumeSmoke}.java
          "$JAVA_HOME_8_X64/bin/java" -cp "$cp" ArtifactSmoke "${{ matrix.minecraft }}" "$qa"/tone.*
          "$JAVA_HOME_8_X64/bin/java" -cp "$cp" SeekResumeSmoke "$qa/tone.ogg"
      - uses: actions/upload-artifact@v4
        with:
          name: DangoMusic-Forge-${{ matrix.minecraft }}
          path: ${{ matrix.directory }}/build/libs/DangoMusic-*+${{ matrix.minecraft }}.jar
          if-no-files-found: error
